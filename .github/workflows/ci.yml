name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shellcheck (errors only)
        run: shellcheck -S error install.sh uninstall.sh bin/mailctl scripts/*.sh
      - name: Local checks (syntax, compile, unit tests, templates)
        run: bash tests/run_local.sh
